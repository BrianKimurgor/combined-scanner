[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-scanner"
version = "0.1.0"
description = "Scan a codebase or PR diff with open-source scanners and merge results into one report."
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "BrianKimurgor", email = "kimurgorbrian20@gmail.com" }]  # pii:ignore - public contact
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "httpx>=0.27",
]
pii = [
    "presidio-analyzer>=2.2",
]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
]

[project.scripts]
scanner = "scanner.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/scanner"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/scanner/report/html.py" = ["E501"]  # embedded HTML/CSS/JS template

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
