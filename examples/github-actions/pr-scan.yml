# Example: scan every pull request and report only what the change introduced.
# Copy to .github/workflows/ in the repository you want to protect. Not run by this repository.
# Actions are pinned to full commit SHAs (version in the comment) so a moved tag cannot change them.
# Untested against a real GitHub runner; adjust the image build or install step to your setup.
name: Code scan

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write       # post the summary comment
  security-events: write     # upload SARIF to code scanning

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0     # the base commit must be present to compare against

      - name: Build the scanner image
        run: |
          git clone --depth 1 https://github.com/BrianKimurgor/combined-scanner.git /tmp/code-scanner
          docker build -f /tmp/code-scanner/docker/Dockerfile.worker -t code-scanner /tmp/code-scanner

      - name: Scan the pull request
        id: scan
        run: |
          mkdir -p scan-out && chmod 777 scan-out
          # Compare the PR's base commit with its head commit; only new findings can fail the gate.
          set +e
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" -v "$PWD/scan-out:/out" -w /repo \
            code-scanner scan /repo \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --format json --output /out/report.json
          code=$?
          for format in sarif comment html; do
            docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/scan-out:/out" \
              code-scanner render /out/report.json --format "$format" --output "/out/report.$format"
          done
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0             # the gate result is applied in the last step, after reporting

      - name: Upload findings to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scan-out/report.sarif

      - name: Comment on the pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('scan-out/report.comment', 'utf8');
            const marker = '<!-- code-scanner:pr-comment -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-scan-report
          path: scan-out/report.html

      - name: Apply the quality gate
        run: exit ${{ steps.scan.outputs.exit_code }}
